[package]
name = "lane"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "File-level isolation for AI coding agents without git worktrees"
repository = "https://github.com/adamblumoff/lane"
readme = "README.md"
keywords = ["ai-agents", "cli", "vfs", "workflow", "worktrees"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "lane"
path = "src/cli_main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
similar = "3.1.1"
thiserror = "1.0.69"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Threading"] }
winfsp_wrs = "0.4.1"

[build-dependencies]
winfsp_build = "0.1.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
clone_on_copy = "deny"
large_enum_variant = "deny"
manual_ok_or = "deny"
needless_collect = "deny"
perf = "deny"
redundant_clone = "deny"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
proptest = "1.11.0"
